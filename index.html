<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميكامار + أكوابورا</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#f5f2ed;
    color:#171717;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    width:100%;
    max-width:500px;
    margin:0 auto;
    padding:0 14px 25px;
}

/* LOGO */

.header{
    text-align:center;
    padding:25px 5px 18px;
}

.brand{
    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    letter-spacing:4px;
    color:#92784a;
}

/* VIDEO */

.video-box{
    width:100%;
    background:#111;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.video-box video{
    display:block;
    width:100%;
    height:auto;
    max-height:700px;
    object-fit:cover;
}

/* PRODUCT */

.product{
    text-align:center;
    padding:25px 8px 5px;
}

.product h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:31px;
    font-weight:normal;
    line-height:1.5;
}

.price{
    margin-top:9px;
    font-size:27px;
    font-weight:bold;
}

.delivery{
    display:inline-block;
    margin-top:12px;
    padding:9px 17px;
    background:#eee7d9;
    color:#735c35;
    border-radius:30px;
    font-size:12px;
    font-weight:bold;
}

/* ORDER */

.order-card{
    margin-top:20px;
    background:#fff;
    border-radius:21px;
    padding:21px;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-bottom:7px;
    color:#555;
    font-size:12px;
}

input,
textarea{
    width:100%;
    border:1px solid #ddd5c8;
    border-radius:12px;
    background:#faf9f7;
    padding:14px;
    margin:0 0 16px;

    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;

    outline:none;
    color:#171717;
}

input{
    height:50px;
}

textarea{
    min-height:105px;
    resize:none;
}

input:focus,
textarea:focus{
    border-color:#a78955;
    background:#fff;
}

.order-button{
    width:100%;
    height:54px;

    border:0;
    border-radius:13px;

    background:#171717;
    color:#fff;

    font-family:Tahoma,Arial,sans-serif;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    transition:.15s ease;
}

.order-button:active{
    transform:scale(.98);
}

.order-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    text-align:center;
    margin-top:13px;
    font-size:13px;
    line-height:1.8;
}

.error{
    color:#c62828;
}

.warning{
    color:#8a6d1d;
}

/* WHATSAPP */

.whatsapp{
    position:fixed;

    left:18px;
    bottom:18px;

    width:58px;
    height:58px;

    border-radius:50%;

    background:#25D366;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    font-size:28px;

    box-shadow:0 6px 20px rgba(0,0,0,.25);

    z-index:9999;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#999;
    font-size:10px;
    padding:25px 5px 5px;
}

</style>

</head>

<body>

<div class="container">

    <!-- BRAND -->

    <header class="header">

        <div class="brand">
            ORIGINAL PERFUMES
        </div>

    </header>


    <!-- VIDEO -->

    <div class="video-box">

        <video
            controls
            playsinline
            preload="metadata"
        >

            <source
                src="video.mp4"
                type="video/mp4"
            >

            متصفحك لا يدعم تشغيل الفيديو.

        </video>

    </div>


    <!-- PRODUCT -->

    <section class="product">

        <h1>
            ميكامار + أكوابورا
        </h1>

        <div class="price">
            45,000 د.ع
        </div>

        <div class="delivery">
            🚚 التوصيل مجاني لجميع محافظات العراق
        </div>

    </section>


    <!-- ORDER FORM -->

    <div class="order-card">

        <label for="phone">
            رقم الهاتف
        </label>

        <input
            id="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="11"
            placeholder="077XXXXXXXX"
        >


        <label for="address">
            العنوان الكامل
        </label>

        <textarea
            id="address"
            placeholder="المحافظة، المنطقة، أقرب نقطة..."
        ></textarea>


        <button
            id="orderButton"
            class="order-button"
            type="button"
            onclick="sendOrder()"
        >
            اطلب الآن
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <div class="footer">
        التوصيل متوفر لجميع محافظات العراق
    </div>

</div>


<!-- WHATSAPP -->

<a
    class="whatsapp"
    href="https://wa.me/9647775037750"
    target="_blank"
    rel="noopener"
    aria-label="WhatsApp"
>
    ☎
</a>


<script>

/* =====================================================
   TELEGRAM SETTINGS
===================================================== */

const TELEGRAM_TOKEN =
"7602821198:AAHHrMz_Ny9BtNf2TLqHTJHZxD_UbUiMsME";

const CHAT_ID =
"-1002694463022";


/* =====================================================
   24 HOUR DEVICE LIMIT
===================================================== */

const STORAGE_KEY =
"last_order_time";

const TWENTY_FOUR_HOURS =
24 * 60 * 60 * 1000;

let sending = false;


/* =====================================================
   CHECK LAST ORDER
===================================================== */

function hasRecentOrder(){

    const last =
        localStorage.getItem(STORAGE_KEY);

    if(!last){
        return false;
    }

    const elapsed =
        Date.now() - Number(last);

    if(elapsed < TWENTY_FOUR_HOURS){
        return true;
    }

    localStorage.removeItem(STORAGE_KEY);

    return false;
}


/* =====================================================
   NORMALIZE IRAQI PHONE
===================================================== */

function normalizePhone(value){

    let phone =
        value
        .replace(/\s+/g,"")
        .replace(/-/g,"")
        .replace(/[^\d+]/g,"");


    /* 00964XXXXXXXXXX */

    if(phone.startsWith("00964")){
        phone =
            "0" +
            phone.substring(5);
    }


    /* +964XXXXXXXXXX */

    if(phone.startsWith("+964")){
        phone =
            "0" +
            phone.substring(4);
    }


    return phone;
}


/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder(){

    if(sending){
        return;
    }


    const phoneInput =
        document.getElementById("phone");

    const addressInput =
        document.getElementById("address");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("orderButton");


    let phone =
        normalizePhone(
            phoneInput.value.trim()
        );

    const address =
        addressInput.value.trim();


    message.textContent = "";


    /* 24 HOURS */

    if(hasRecentOrder()){

        message.className =
            "message warning";

        message.textContent =
            "⚠️ تم تسجيل طلبك مسبقاً، يمكنك الطلب مرة أخرى بعد 24 ساعة.";

        return;
    }


    /* PHONE */

    if(!/^07\d{9}$/.test(phone)){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال رقم عراقي صحيح مكون من 11 رقم.";

        return;
    }


    /* ADDRESS */

    if(address.length < 5){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال العنوان الكامل.";

        return;
    }


    /* START */

    sending = true;

    button.disabled = true;

    button.textContent =
        "⏳ جاري إرسال الطلب...";


    /* =================================================
       TELEGRAM MESSAGE
    ================================================= */

    const text =
`🔥 طلب جديد

🌸 العرض: ميكامار + أكوابورا
💰 السعر: 45,000 د.ع
🚚 التوصيل: مجاني

📞 رقم الهاتف:
${phone}

📍 العنوان:
${address}`;


    try{

        const response =
            await fetch(

                "https://api.telegram.org/bot" +
                TELEGRAM_TOKEN +
                "/sendMessage",

                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        chat_id:
                        CHAT_ID,

                        text:
                        text

                    })

                }

            );


        const data =
            await response.json();


        /* =================================================
           TELEGRAM SUCCESS
        ================================================= */

        if(data.ok){

            /* حفظ وقت الطلب */

            localStorage.setItem(
                STORAGE_KEY,
                Date.now().toString()
            );


            /* الانتقال للنجاح */

            window.location.href =
                "success.html";

            return;
        }


        /* Telegram Error */

        console.error(
            "Telegram Error:",
            data
        );

        throw new Error(
            data.description ||
            "Telegram Error"
        );


    }catch(error){

        console.error(error);

        message.className =
            "message error";

        message.textContent =
            "فشل إرسال الطلب، تأكد من اتصال الإنترنت وحاول مرة أخرى.";

        button.disabled = false;

        button.textContent =
            "اطلب الآن";

        sending = false;
    }

}

</script>

</body>

</html>
