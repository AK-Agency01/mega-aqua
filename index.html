<script>

/* ================================
   TELEGRAM
================================ */

const TELEGRAM_TOKEN =
"7602821198:AAHHrMz_Ny9BtNf2TLqHTJHZxD_UbUiMsME";

const CHAT_ID =
"-1002694463022";


/* ================================
   منع الطلب أكثر من مرة خلال 24 ساعة
   على نفس الجهاز
================================ */

const STORAGE_KEY =
"last_order_time";

const LIMIT =
24 * 60 * 60 * 1000;

let sending = false;


/* ================================
   التحقق من آخر طلب
================================ */

function recentOrder(){

    const last =
        localStorage.getItem(STORAGE_KEY);

    if(!last){
        return false;
    }

    const elapsed =
        Date.now() - Number(last);

    if(elapsed < LIMIT){
        return true;
    }

    localStorage.removeItem(STORAGE_KEY);

    return false;
}


/* ================================
   إرسال الطلب
================================ */

async function sendOrder(){

    if(sending){
        return;
    }

    const phone =
        document.getElementById("phone")
        .value.trim();

    const address =
        document.getElementById("address")
        .value.trim();

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("orderButton");


    message.textContent = "";


    /* منع الطلب خلال 24 ساعة */

    if(recentOrder()){

        message.className =
            "message warning";

        message.textContent =
            "⚠️ تم تسجيل طلبك مسبقاً، يمكنك الطلب مرة أخرى بعد 24 ساعة.";

        return;
    }


    /* التحقق من الرقم */

    if(phone.length < 10){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال رقم هاتف صحيح.";

        return;
    }


    /* التحقق من العنوان */

    if(address.length < 5){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال العنوان الكامل.";

        return;
    }


    sending = true;

    button.disabled = true;

    button.textContent =
        "⏳ جاري إرسال الطلب...";


    /* ================================
       رسالة التليگرام
    ================================= */

    const text =

`🔥 طلب جديد

🌸 العرض: ميكامار + أكوابورا

💰 السعر: 45,000 د.ع

🚚 التوصيل: مجاني

📞 الرقم: ${phone}

📍 العنوان: ${address}`;


    try{

        const response =
            await fetch(

                "https://api.telegram.org/bot" +
                TELEGRAM_TOKEN +
                "/sendMessage",

                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        chat_id:CHAT_ID,

                        text:text

                    })

                }

            );


        const data =
            await response.json();


        /* ================================
           نجاح
        ================================= */

        if(data.ok){

            localStorage.setItem(
                STORAGE_KEY,
                Date.now().toString()
            );

            window.location.href =
                "success.html";

            return;
        }


        throw new Error(
            data.description ||
            "Telegram Error"
        );


    }catch(error){

        console.error(error);

        message.className =
            "message error";

        message.textContent =
            "فشل إرسال الطلب. حاول مرة أخرى.";

        button.disabled = false;

        button.textContent =
            "اطلب الآن";

        sending = false;
    }

}

</script>

</body>
</html>
