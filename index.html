<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميكامار + أكوابورا</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f2ed;
    color:#171717;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    width:min(500px,calc(100% - 24px));
    margin:auto;
}

.header{
    text-align:center;
    padding:22px 10px 14px;
}

.brand{
    font-family:Georgia,serif;
    font-size:15px;
    letter-spacing:3px;
    color:#8d7448;
}

.video-box{
    width:100%;
    background:#111;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.video-box video{
    display:block;
    width:100%;
    height:auto;
    max-height:680px;
    object-fit:cover;
}

.product{
    text-align:center;
    padding:25px 10px 8px;
}

.product h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:normal;
    font-size:32px;
    line-height:1.4;
}

.price{
    margin-top:10px;
    font-size:27px;
    font-weight:bold;
}

.delivery{
    display:inline-block;
    margin-top:12px;
    padding:9px 16px;
    background:#eee7d9;
    color:#735c35;
    border-radius:30px;
    font-size:12px;
    font-weight:bold;
}

.order-card{
    background:#fff;
    margin-top:20px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-bottom:7px;
    font-size:12px;
    color:#555;
}

input,
textarea{
    width:100%;
    border:1px solid #ddd5c8;
    border-radius:11px;
    background:#faf9f7;
    padding:14px;
    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
}

input:focus,
textarea:focus{
    border-color:#a78955;
    background:#fff;
}

textarea{
    min-height:100px;
    resize:none;
}

.order-button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:17px;
    background:#171717;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.order-button:active{
    transform:scale(.98);
}

.order-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    text-align:center;
    font-size:13px;
    line-height:1.8;
    margin-top:12px;
}

.error{
    color:#c62828;
}

.warning{
    color:#8a6d1d;
}

.whatsapp{
    position:fixed;
    left:18px;
    bottom:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:27px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    z-index:9999;
}

.footer{
    text-align:center;
    color:#999;
    font-size:10px;
    padding:28px 10px;
}

</style>

</head>

<body>

<div class="container">

<header class="header">

    <div class="brand">
        ORIGINAL PERFUMES
    </div>

</header>


<!-- VIDEO -->

<div class="video-box">

    <video
        controls
        playsinline
        preload="metadata"
    >

        <source
            src="video.mp4"
            type="video/mp4"
        >

        متصفحك لا يدعم تشغيل الفيديو.

    </video>

</div>


<!-- PRODUCT -->

<section class="product">

    <h1>
        ميكامار + أكوابورا
    </h1>

    <div class="price">
        45,000 د.ع
    </div>

    <div class="delivery">
        🚚 التوصيل مجاني لجميع محافظات العراق
    </div>

</section>


<!-- ORDER -->

<div class="order-card">

    <label>
        رقم الهاتف
    </label>

    <input
        id="phone"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        placeholder="077XXXXXXXX"
    >


    <label>
        العنوان الكامل
    </label>

    <textarea
        id="address"
        placeholder="المحافظة، المنطقة، أقرب نقطة..."
    ></textarea>


    <button
        id="orderButton"
        class="order-button"
        onclick="sendOrder()"
    >
        اطلب الآن
    </button>


    <div
        id="message"
        class="message"
    ></div>

</div>


<div class="footer">
    التوصيل متوفر لجميع محافظات العراق
</div>

</div>


<!-- WHATSAPP -->

<a
    class="whatsapp"
    href="https://wa.me/9647775037750"
    target="_blank"
    aria-label="WhatsApp"
>
    ☎
</a>


<script>

/* =====================================================
   CLOUDFLARE WORKER URL
   غيّر هذا الرابط بعد إنشاء الـ Worker
===================================================== */

const TELEGRAM_API =
    "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";


/* =====================================================
   24 HOUR LIMIT
===================================================== */

const ORDER_STORAGE_KEY =
    "perfume_last_order_time";

const TWENTY_FOUR_HOURS =
    24 * 60 * 60 * 1000;


/* =====================================================
   CHECK RECENT ORDER
===================================================== */

function hasRecentOrder(){

    const lastOrder =
        localStorage.getItem(
            ORDER_STORAGE_KEY
        );

    if(!lastOrder){
        return false;
    }

    const elapsed =
        Date.now() - Number(lastOrder);

    if(elapsed < TWENTY_FOUR_HOURS){
        return true;
    }

    localStorage.removeItem(
        ORDER_STORAGE_KEY
    );

    return false;
}


/* =====================================================
   SEND ORDER
===================================================== */

let sending = false;


async function sendOrder(){

    if(sending){
        return;
    }


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("orderButton");


    message.textContent = "";


    /* 24 HOURS */

    if(hasRecentOrder()){

        message.className =
            "message warning";

        message.textContent =
            "⚠️ تم تسجيل طلبك مسبقاً، يمكنك الطلب مرة أخرى بعد 24 ساعة.";

        return;
    }


    /* PHONE */

    if(phone.length < 10){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال رقم هاتف صحيح.";

        return;
    }


    /* ADDRESS */

    if(address.length < 5){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال العنوان الكامل.";

        return;
    }


    sending = true;

    button.disabled = true;

    button.textContent =
        "⏳ جاري إرسال الطلب...";


    /* =================================================
       SEND TO CLOUDFLARE WORKER
    ================================================= */

    try{

        const response =
            await fetch(
                TELEGRAM_API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        product:
                            "ميكامار + أكوابورا",

                        price:
                            "45,000 د.ع",

                        phone:
                            phone,

                        address:
                            address

                    })
                }
            );


        const data =
            await response.json();


        if(!data.ok){

            throw new Error(
                "Order failed"
            );

        }


        /* =============================================
           SAVE ORDER TIME
        ============================================= */

        localStorage.setItem(
            ORDER_STORAGE_KEY,
            Date.now().toString()
        );


        /* =============================================
           SUCCESS PAGE
        ============================================= */

        window.location.href =
            "success.html";


    }catch(error){

        console.error(error);

        message.className =
            "message error";

        message.textContent =
            "تعذر إرسال الطلب، حاول مرة أخرى.";

        button.disabled = false;

        button.textContent =
            "اطلب الآن";

        sending = false;

    }

}

</script>

</body>

</html>
