<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميكامار + أكوابورا</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at 15% 10%, rgba(125,91,150,.10), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(188,160,111,.10), transparent 30%),
        #f7f5f2;
    color:#18151a;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    width:100%;
    max-width:500px;
    margin:0 auto;
    padding:0 16px 28px;
}

.header{
    text-align:center;
    padding:30px 5px 22px;
}

.brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    letter-spacing:4px;
    color:#79558e;
    font-weight:600;
}

.brand:before,
.brand:after{
    content:"";
    width:28px;
    height:1px;
    background:linear-gradient(90deg,transparent,#b69b74);
}

.product{
    position:relative;
    text-align:center;
    padding:32px 18px 24px;
    margin-top:4px;
    background:rgba(255,255,255,.76);
    border:1px solid rgba(121,85,142,.10);
    border-radius:28px;
    box-shadow:0 18px 55px rgba(30,22,35,.08);
    backdrop-filter:blur(12px);
}

.product h1{
    position:relative;
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:31px;
    font-weight:normal;
    line-height:1.5;
    letter-spacing:.2px;
}

.price{
    position:relative;
    margin-top:13px;
    font-size:31px;
    font-weight:800;
    color:#68447b;
    letter-spacing:.2px;
}

.delivery{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:13px;
    padding:10px 16px;
    background:#f1eaf3;
    color:#654c70;
    border:1px solid #e4d8e8;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
}

.order-card{
    margin-top:18px;
    background:rgba(255,255,255,.92);
    border:1px solid rgba(0,0,0,.055);
    border-radius:24px;
    padding:23px;
    box-shadow:0 14px 42px rgba(30,22,35,.075);
}

label{
    display:block;
    margin:0 2px 8px;
    color:#4e4851;
    font-size:12px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    border:1px solid #e1dce2;
    border-radius:15px;
    background:#faf9fb;
    padding:14px 15px;
    margin:0 0 17px;
    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;
    outline:none;
    color:#17151a;
    transition:border-color .2s,box-shadow .2s,background .2s;
}

input{
    height:52px;
}

textarea{
    min-height:105px;
    resize:none;
}

input:focus,
textarea:focus{
    border-color:#9b78aa;
    background:#fff;
    box-shadow:0 0 0 4px rgba(121,85,142,.08);
}

.order-button{
    width:100%;
    height:56px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,#241b28,#62406f);
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(76,49,88,.22);
    transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
}

.order-button:hover{
    transform:translateY(-1px);
    box-shadow:0 13px 28px rgba(76,49,88,.28);
}

.order-button:active{
    transform:scale(.985);
}

.order-button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    text-align:center;
    margin-top:13px;
    font-size:13px;
    line-height:1.8;
}

.error{color:#c62828}
.warning{color:#8a6d1d}

.whatsapp{
    position:fixed;
    left:18px;
    bottom:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:28px;
    box-shadow:0 8px 24px rgba(0,0,0,.20);
    z-index:9999;
    transition:transform .2s ease;
}

.whatsapp:hover{
    transform:translateY(-2px) scale(1.03);
}

.footer{
    text-align:center;
    color:#999;
    font-size:10px;
    padding:24px 5px 5px;
}
</style>

</head>

<body>

<div class="container">

    <!-- BRAND -->

    <header class="header">

        <div class="brand">
            وكالة رسالة للعطور الاصلية
        </div>

    </header>


    <!-- PRODUCT -->

    <section class="product">

        <h1>
            ميكامار + أكوابورا
        </h1>

        <div class="price">
            25,000 د.ع
        </div>

        <div class="delivery">
            🚚 التوصيل مجاني لجميع محافظات العراق
        </div>

    </section>


    <!-- ORDER FORM -->

    <div class="order-card">

        <label for="phone">
            رقم الهاتف
        </label>

        <input
            id="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="11"
            placeholder="077XXXXXXXX"
        >


        <label for="address">
            العنوان الكامل
        </label>

        <textarea
            id="address"
            placeholder="المحافظة، المنطقة، أقرب نقطة..."
        ></textarea>


        <button
            id="orderButton"
            class="order-button"
            type="button"
            onclick="sendOrder()"
        >
            اطلب الآن
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <div class="footer">
        التوصيل متوفر لجميع محافظات العراق
    </div>

</div>


<!-- WHATSAPP -->

<a
    class="whatsapp"
    href="https://wa.me/9647775037750"
    target="_blank"
    rel="noopener"
    aria-label="WhatsApp"
>
    ☎
</a>


<script>

/* =====================================================
   TELEGRAM SETTINGS
===================================================== */

const TELEGRAM_TOKEN =
"7602821198:AAHHrMz_Ny9BtNf2TLqHTJHZxD_UbUiMsME";

const CHAT_ID =
"-1002694463022";


/* =====================================================
   24 HOUR DEVICE LIMIT
===================================================== */

const STORAGE_KEY =
"last_order_time";

const TWENTY_FOUR_HOURS =
24 * 60 * 60 * 1000;

let sending = false;


/* =====================================================
   CHECK LAST ORDER
===================================================== */

function hasRecentOrder(){

    const last =
        localStorage.getItem(STORAGE_KEY);

    if(!last){
        return false;
    }

    const elapsed =
        Date.now() - Number(last);

    if(elapsed < TWENTY_FOUR_HOURS){
        return true;
    }

    localStorage.removeItem(STORAGE_KEY);

    return false;
}


/* =====================================================
   NORMALIZE IRAQI PHONE
===================================================== */

function normalizePhone(value){

    let phone =
        value
        .replace(/\s+/g,"")
        .replace(/-/g,"")
        .replace(/[^\d+]/g,"");


    /* 00964XXXXXXXXXX */

    if(phone.startsWith("00964")){
        phone =
            "0" +
            phone.substring(5);
    }


    /* +964XXXXXXXXXX */

    if(phone.startsWith("+964")){
        phone =
            "0" +
            phone.substring(4);
    }


    return phone;
}


/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder(){

    if(sending){
        return;
    }


    const phoneInput =
        document.getElementById("phone");

    const addressInput =
        document.getElementById("address");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("orderButton");


    let phone =
        normalizePhone(
            phoneInput.value.trim()
        );

    const address =
        addressInput.value.trim();


    message.textContent = "";


    /* 24 HOURS */

    if(hasRecentOrder()){

        message.className =
            "message warning";

        message.textContent =
            "⚠️ تم تسجيل طلبك مسبقاً، يمكنك الطلب مرة أخرى بعد 24 ساعة.";

        return;
    }


    /* PHONE */

    if(!/^07\d{9}$/.test(phone)){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال رقم عراقي صحيح مكون من 11 رقم.";

        return;
    }


    /* ADDRESS */

    if(address.length < 5){

        message.className =
            "message error";

        message.textContent =
            "يرجى إدخال العنوان الكامل.";

        return;
    }


    /* START */

    sending = true;

    button.disabled = true;

    button.textContent =
        "⏳ جاري إرسال الطلب...";


    /* =================================================
       TELEGRAM MESSAGE
    ================================================= */

    const text =
`🔥 طلب جديد

🌸 العرض: ميكامار + أكوابورا
💰 السعر: 25,000 د.ع
🚚 التوصيل: مجاني

📞 رقم الهاتف:
${phone}

📍 العنوان:
${address}`;


    try{

        const response =
            await fetch(

                "https://api.telegram.org/bot" +
                TELEGRAM_TOKEN +
                "/sendMessage",

                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        chat_id:
                        CHAT_ID,

                        text:
                        text

                    })

                }

            );


        const data =
            await response.json();


        /* =================================================
           TELEGRAM SUCCESS
        ================================================= */

        if(data.ok){

            /* حفظ وقت الطلب */

            localStorage.setItem(
                STORAGE_KEY,
                Date.now().toString()
            );


            /* الانتقال للنجاح */

            window.location.href =
                "success.html";

            return;
        }


        /* Telegram Error */

        console.error(
            "Telegram Error:",
            data
        );

        throw new Error(
            data.description ||
            "Telegram Error"
        );


    }catch(error){

        console.error(error);

        message.className =
            "message error";

        message.textContent =
            "فشل إرسال الطلب، تأكد من اتصال الإنترنت وحاول مرة أخرى.";

        button.disabled = false;

        button.textContent =
            "اطلب الآن";

        sending = false;
    }

}

</script>

</body>

</html>
