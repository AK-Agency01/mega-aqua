<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>تم استلام الطلب</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    background:#f5f2ed;

    color:#171717;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}


.card{

    width:min(450px,100%);

    background:#fff;

    border-radius:27px;

    padding:42px 25px;

    text-align:center;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.10);
}


/* CHECK */

.check{

    width:78px;
    height:78px;

    margin:0 auto 25px;

    border-radius:50%;

    background:#171717;

    color:#d2b574;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:40px;

    font-family:Arial,sans-serif;
}


/* TITLE */

h1{

    margin:0 0 22px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:normal;

    font-size:31px;

    line-height:1.5;
}


/* PRODUCT */

.product{

    font-size:20px;

    font-weight:bold;

    margin-bottom:13px;

}


/* PRICE */

.price{

    font-size:17px;

    color:#777;

}


/* MESSAGE */

.message{

    margin-top:22px;

    color:#666;

    line-height:2;

    font-size:14px;

}


/* DELIVERY */

.delivery{

    display:inline-block;

    margin-top:23px;

    padding:12px 22px;

    background:#eee7d9;

    color:#735c35;

    border-radius:30px;

    font-size:14px;

    font-weight:bold;

    line-height:1.8;
}


/* BRAND */

.brand{

    margin-top:30px;

    color:#a0844f;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:11px;

    letter-spacing:3px;

}

</style>

</head>

<body>


<div class="card">


    <!-- SUCCESS ICON -->

    <div class="check">
        ✓
    </div>


    <!-- TITLE -->

    <h1>
        تم استلام طلبك بنجاح
    </h1>


    <!-- PRODUCT -->

    <div class="product">
        ميكامار + أكوابورا
    </div>


    <!-- PRICE -->

    <div class="price">
        45,000 د.ع
    </div>


    <!-- MESSAGE -->

    <div class="message">

        شكراً لطلبك ❤️

        <br>

        تم تسجيل طلبك بنجاح.

    </div>


    <!-- DELIVERY -->

    <div class="delivery">

        🚚 سيتم توصيل الطلب خلال يومين

    </div>


    <!-- BRAND -->

    <div class="brand">
        ORIGINAL PERFUMES
    </div>


</div>


</body>

</html>
