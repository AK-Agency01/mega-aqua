```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>تم استلام الطلب</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:#f5f2ed;

    color:#171717;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.card{
    width:min(450px,100%);

    background:#fff;

    border-radius:25px;

    padding:42px 25px;

    text-align:center;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.10);
}

.check{
    width:76px;
    height:76px;

    margin:0 auto 23px;

    border-radius:50%;

    background:#171717;

    color:#d2b574;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:36px;
}

h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:normal;

    font-size:30px;

    line-height:1.5;

    margin:0 0 18px;
}

.product{
    font-size:19px;
    font-weight:bold;
    margin-bottom:18px;
}

.price{
    font-size:16px;
    color:#777;
}

.message{
    margin-top:18px;
    color:#666;
    line-height:2;
    font-size:14px;
}

.delivery{
    display:inline-block;

    margin-top:22px;

    background:#eee7d9;

    color:#735c35;

    border-radius:30px;

    padding:11px 18px;

    font-size:13px;

    font-weight:bold;
}

.brand{
    margin-top:28px;

    color:#a0844f;

    font-size:10px;

    letter-spacing:2px;
}

</style>

</head>

<body>

<div class="card">

    <div class="check">
        ✓
    </div>

    <h1>
        تم استلام طلبك بنجاح
    </h1>

    <div class="product">
        ميكامار + أكوابورا
    </div>

    <div class="price">
        45,000 د.ع
    </div>

    <div class="message">
        شكراً لطلبك ❤️
        <br>
        تم تسجيل طلبك بنجاح.
    </div>

    <div class="delivery">
        🚚 سيتم توصيل الطلب خلال يومين
    </div>

    <div class="brand">
        ORIGINAL PERFUMES
    </div>

</div>

</body>

</html>
```
